name: Deploy SparkCall

on:
  workflow_dispatch:
    inputs:
      auth_method:
        description: Cloudflare authorization method
        type: choice
        options:
          - api-token
          - device
        default: api-token
        required: true

permissions:
  contents: read

concurrency:
  group: sparkcall-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Verify, migrate and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Require isolated HTTP and D1 integration tests
        run: npm run test:integration
      - name: Configure deployment targets
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          SPARKCALL_HOSTNAME: ${{ vars.SPARKCALL_HOSTNAME }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const databaseId = process.env.D1_DATABASE_ID || "";
          const hostname = process.env.SPARKCALL_HOSTNAME || "";
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || "";
          const adminUserIds = (process.env.ADMIN_USER_IDS || "").split(",").map(value => value.trim()).filter(Boolean).join(",");
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(databaseId)) {
            console.error("Set the D1_DATABASE_ID repository variable to the target database UUID.");
            process.exit(1);
          }
          if (!/^[0-9a-f]{32}$/i.test(accountId)) {
            console.error("Set the CLOUDFLARE_ACCOUNT_ID Actions secret to the target account ID.");
            process.exit(1);
          }
          if (!/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(hostname)) {
            console.error("Set the SPARKCALL_HOSTNAME repository variable to a hostname in your Cloudflare zone.");
            process.exit(1);
          }
          if (!/^[A-Za-z0-9_-]{1,80}(?:,[A-Za-z0-9_-]{1,80})*$/.test(adminUserIds)) {
            console.error("Set the ADMIN_USER_IDS repository variable to one or more comma-separated SparkCall user IDs.");
            process.exit(1);
          }
          const path = "wrangler.jsonc";
          let config = fs.readFileSync(path, "utf8");
          for (const [placeholder, value] of [
            ["00000000-0000-4000-8000-000000000000", databaseId],
            ["app.example.com", hostname],
            ["REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID", accountId],
            ["REPLACE_WITH_ADMIN_USER_IDS", adminUserIds],
          ]) {
            if (!config.includes(placeholder)) throw new Error("Expected deployment placeholder is missing.");
            config = config.replaceAll(placeholder, value);
          }
          fs.writeFileSync(path, config);
          NODE
      - name: Validate API token configuration
        if: ${{ inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets, or manually dispatch this workflow using device authorization."
            exit 1
          fi
      - name: Authenticate with Wrangler device authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler login --device
      - name: Preflight Worker secret names (API token)
        if: ${{ inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler secret list --name sparkcall --format json | node -e '
            const required = ["INTERNAL_SIGNALING_TOKEN", "TURN_KEY_ID", "TURN_API_TOKEN", "SPARKCALL_WEBHOOK_ENCRYPTION_KEY", "TURN_ANALYTICS_API_TOKEN"];
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try {
                const present = new Set(JSON.parse(input).map(item => item.name));
                const missing = required.filter(name => !present.has(name));
                if (missing.length) { console.error("Missing Worker secret names: " + missing.join(", ")); process.exit(1); }
                console.log("Required Worker secret names are present.");
              } catch {
                console.error("Could not read Worker secret-name listing. Bootstrap an unbound sparkcall Worker and configure required secrets; stopping before migration/deploy.");
                process.exit(1);
              }
            });
          '
      - name: Preflight Worker secret names (device authorization)
        if: ${{ inputs.auth_method == 'device' }}
        run: |
          npx wrangler secret list --name sparkcall --format json | node -e '
            const required = ["INTERNAL_SIGNALING_TOKEN", "TURN_KEY_ID", "TURN_API_TOKEN", "SPARKCALL_WEBHOOK_ENCRYPTION_KEY", "TURN_ANALYTICS_API_TOKEN"];
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try {
                const present = new Set(JSON.parse(input).map(item => item.name));
                const missing = required.filter(name => !present.has(name));
                if (missing.length) { console.error("Missing Worker secret names: " + missing.join(", ")); process.exit(1); }
                console.log("Required Worker secret names are present.");
              } catch {
                console.error("Could not read Worker secret-name listing. Bootstrap an unbound sparkcall Worker and configure required secrets; stopping before migration/deploy.");
                process.exit(1);
              }
            });
          '
      - name: Apply remote D1 migrations (API token)
        if: ${{ inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply sparkcall-db --remote
      - name: Deploy Worker and static assets (API token)
        if: ${{ inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Apply remote D1 migrations (device authorization)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler d1 migrations apply sparkcall-db --remote
      - name: Deploy Worker and static assets (device authorization)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler deploy
