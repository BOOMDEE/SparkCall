name: Deploy SparkCall

on:
  push:
    branches: [Main]
  workflow_dispatch:
    inputs:
      auth_method:
        description: Cloudflare authorization method
        type: choice
        options:
          - api-token
          - device
        default: api-token
        required: true

permissions:
  contents: read

concurrency:
  group: sparkcall-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    name: Verify, migrate and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Validate API token configuration
        if: ${{ github.event_name == 'push' || inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets, or manually dispatch this workflow using device authorization."
            exit 1
          fi
      - name: Authenticate with Wrangler device authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler login --device
      - name: Apply remote D1 migrations (API token)
        if: ${{ github.event_name == 'push' || inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply sparkcall-db --remote
      - name: Deploy Worker and static assets (API token)
        if: ${{ github.event_name == 'push' || inputs.auth_method == 'api-token' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Apply remote D1 migrations (device authorization)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler d1 migrations apply sparkcall-db --remote
      - name: Deploy Worker and static assets (device authorization)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_method == 'device' }}
        run: npx wrangler deploy
