name: Test

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests, build, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Verify isolated local D1 and HTTP integration
        run: npm run test:integration
        env:
          CI: "1"
